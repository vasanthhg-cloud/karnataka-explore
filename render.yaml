# One-click deploy blueprint for Render (https://render.com).
# Free tier: the SQLite file is rebuilt on every deploy, so demo data resets.
services:
  - type: web
    name: karnataka-explore
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DB_BACKEND
        value: sqlite
