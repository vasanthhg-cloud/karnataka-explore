{% if info and info.pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if info.has_prev %}<a href="{{ page_url(info.page - 1) }}">Prev</a>{% endif %}
  {% for p in range(1, info.pages + 1) %}
    {% if p == info.page %}<span class="current">{{ p }}</span>
    {% else %}<a href="{{ page_url(p) }}">{{ p }}</a>{% endif %}
  {% endfor %}
  {% if info.has_next %}<a href="{{ page_url(info.page + 1) }}">Next</a>{% endif %}
</nav>
{% endif %}
