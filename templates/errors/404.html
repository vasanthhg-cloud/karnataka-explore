{% extends "base.html" %}
{% block title %}404 - Page not found{% endblock %}
{% block content %}
<section class="section"><div class="wrap center" style="max-width:560px">
  <div style="font-size:4rem;font-weight:800;color:var(--green-600);letter-spacing:-.04em">404</div>
  <h1 style="font-size:1.7rem">Page not found</h1>
  <p class="muted">That page does not exist. It may have moved, or the link may be wrong.</p>
  <a class="btn btn-primary" href="{{ url_for('public.index') }}">{{ t('nav_home') }}</a>
</div></section>
{% endblock %}
