{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="section"><div class="wrap"><div class="auth-card">
  <h1 style="font-size:1.6rem">Set a new password</h1>
  <p class="muted">{{ email }}</p>
  <form method="post">
    <div class="field"><label for="password">{{ t('password') }}</label>
      <div class="pw-wrap"><input class="input" id="password" type="password" name="password" required minlength="8">
      <button type="button" class="pw-toggle" data-pw-toggle>Show</button></div></div>
    <div class="field"><label for="confirm_password">{{ t('confirm_password') }}</label>
      <input class="input" id="confirm_password" type="password" name="confirm_password" required></div>
    <button class="btn btn-primary btn-block">{{ t('update') }}</button>
  </form>
</div></div></section>
{% endblock %}
